<div class="app-sidebar sidebar-shadow">
  <div class="app-header__logo">
    <div class="logo-src"></div>
    <div class="header__pane ml-auto">
      <div>
        <button
          type="button"
          class="hamburger close-sidebar-btn hamburger--elastic"
          data-class="closed-sidebar"
        >
          <span class="hamburger-box">
            <span class="hamburger-inner"></span>
          </span>
        </button>
      </div>
    </div>
  </div>
  <div class="app-header__mobile-menu">
    <div>
      <button
        type="button"
        class="hamburger hamburger--elastic mobile-toggle-nav"
      >
        <span class="hamburger-box">
          <span class="hamburger-inner"></span>
        </span>
      </button>
    </div>
  </div>
  <div class="app-header__menu">
    <span>
      <button
        type="button"
        class="btn-icon btn-icon-only btn btn-primary btn-sm mobile-toggle-header-nav"
      >
        <span class="btn-icon-wrapper">
          <i class="fa fa-ellipsis-v fa-w-6"></i>
        </span>
      </button>
    </span>
  </div>
  <div class="scrollbar-sidebar">
    <div class="app-sidebar__inner">
      <!--
      <ul class="vertical-nav-menu">
        <li class="app-sidebar__heading">Dashboard</li>
        <li>
          <a routerLink="dashboard" class="mm-active">
            <i class="metismenu-icon fa fa-rocket"></i>
            Dashboard
          </a>
        </li>
        <li class="app-sidebar__heading">UI Components</li>
        <li>
          <a routerLink="products">
            <i class="metismenu-icon fa fa-gem"></i>
            Products
            <i class="metismenu-state-icon fa fa-angle-down caret-left"></i>
          </a>
          <ul>
            <li>
              <a routerLink="product-category">
                <i class="metismenu-icon"></i>
                Product Category
              </a>
            </li>
          </ul>
        </li>
      </ul>
      -->

      <ul class="vertical-nav-menu">
        <li *ngFor="let menuItem of menu" class="has-submenu">
          <!-- Parent Menu Item -->
          <a [routerLink]="menuItem.routerLink" (click)="toggleMenu(menuItem.title)" [class.mm-active]="openMenus.has(menuItem.title)">
            <i class="metismenu-icon" [ngClass]="menuItem.icon"></i>
            {{ menuItem.title }}
            <!-- Dropdown caret -->
            <i *ngIf="menuItem.children.length" class="metismenu-state-icon fa fa-angle-down float-end" [class.rotate-180]="openMenus.has(menuItem.title)"></i>
          </a>

          <!-- Submenu -->
          <ul class="submenu" [class.show]="openMenus.has(menuItem.title)">
            <li *ngFor="let child of menuItem.children">
              <a [routerLink]="child.routerLink" routerLinkActive="mm-active" [routerLinkActiveOptions]="{ exact: child.exact || false }">
                <i class="metismenu-icon"></i>
                {{ child.title }}
              </a>
            </li>
          </ul>
        </li>
      </ul>

    </div>
  </div>
</div>
